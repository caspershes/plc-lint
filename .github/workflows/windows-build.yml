# Сборка plc-lint.exe для Windows.
#
# Кросс-компиляции у PyInstaller нет: .exe собирается только на Windows, а разработка
# идёт на Linux. Поэтому сборку делает раннер windows-latest, а не рабочая машина.
#
# Что получается на выходе: один файл без зависимостей и без установщика. Инженер
# скачивает его и перетаскивает на него экспорт мышью — это единственный сценарий,
# который срабатывает на машине, где нет прав администратора и нет Python. Так же
# он ложится в артефакты релиза, откуда сайт даёт прямую ссылку.
name: windows-build

on:
  push:
    # Только теги версии сборки (v1.0, v1.2.3). Плавающий тег «v1» принадлежит
    # GitHub Action и переставляется при каждом его изменении — пересобирать из-за
    # этого .exe и плодить релизы не нужно.
    tags: ["v*.*"]
  workflow_dispatch:      # ручной запуск: собрать проверочную сборку без тега

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN по умолчанию только читает: без этого шаг релиза падает с 403
    # «Resource not accessible by integration» уже после успешной сборки.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller
        run: pip install pyinstaller==6.11.1

      # --onefile: без папки с библиотеками, иначе «скачал и запустил» превращается
      # в распаковку архива. --console: программа печатает отчёт, окно нужно.
      # engine и i18n — обычные модули рядом с cli.py, PyInstaller находит их по
      # импортам; hidden-import'ы не нужны, движку хватает стандартной библиотеки.
      - name: Сборка
        run: pyinstaller --onefile --console --name plc-lint cli.py

      - name: Проверка собранного .exe
        shell: pwsh
        run: |
          $exe = "dist\plc-lint.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "exe не запускается" }

          # Фикстура лежит в examples/ (публичный репозиторий) или tests/fixtures/
          $fx = @("examples\synthetic_bugs.xml", "tests\fixtures\synthetic_bugs.xml") |
                Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $fx) { throw "не найдена фикстура для проверки сборки" }

          # Прогон на синтетическом экспорте: сборка обязана давать находки,
          # иначе в релиз уедет .exe, который «успешно» ничего не проверяет.
          & $exe $fx --no-html --no-color --json > out.json
          $r = Get-Content out.json -Raw | ConvertFrom-Json
          if ($r[0].summary.high -lt 1) { throw "нет находок — сборка нерабочая" }
          Write-Host "находок: high=$($r[0].summary.high) medium=$($r[0].summary.medium)"

          # HTML рядом с файлом — то, что увидит инженер после drag&drop
          & $exe $fx --no-color | Out-Null
          if (-not (Test-Path ($fx -replace '\.xml$', '-report.html'))) { throw "HTML не создан" }

          # CODESYS .export: формат опознаётся по содержимому, и в сборке должен лежать
          # export_file.py. Без этой проверки отсутствие модуля в .exe вылезло бы у
          # инженера на его файле, а не в CI.
          $ex = @("examples\export_bugs.export", "tests\fixtures\export_bugs.export") |
                Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ex) { throw "не найдена фикстура .export" }
          & $exe $ex --no-html --no-color --json > exp.json
          $e = Get-Content exp.json -Raw | ConvertFrom-Json
          if ($e[0].summary.high -lt 1) { throw ".export разобран без находок — модуля нет в сборке" }
          # на .export обязаны работать и правила по программам: если сборка дерева
          # сломается, POU станет ноль, а находки останутся только по модулям и экранам
          if ($e[0].pou_count -lt 2) { throw "программы из .export не прочитаны" }
          Write-Host ".export: POU=$($e[0].pou_count) high=$($e[0].summary.high) medium=$($e[0].summary.medium)"

      - uses: actions/upload-artifact@v4
        with:
          name: plc-lint-windows
          path: dist/plc-lint.exe

      - name: Релиз (только для тега)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plc-lint.exe
          body: |
            Локальная версия PLC Lint для Windows — один файл, без установки и без Python.

            Проверка идёт на вашем компьютере: программа не выходит в сеть, экспорт
            никуда не отправляется. Перетащите на plc-lint.exe файл .xml (PLCopenXML)
            или .export (выгрузка проекта CODESYS) — рядом появится HTML-отчёт и
            откроется в браузере.

            Что даёт .export: в нём есть не только программы, но и дерево устройств с
            визуализацией, которых нет в PLCopenXML. Поэтому на нём работают ВСЕ правила
            по программам плюс пять, которых нет больше нигде — снятый тип датчика на
            занятом канале, ненастроенный выход, модуль, исключённый из опроса, и две
            находки по экранам (одна переменная под двумя подписями, номер в подписи не
            равен индексу).

            Чего на .export не будет: конфигурация задач в этом формате устроена иначе,
            поэтому правила про сторожевой таймер и дубли Modbus-адресов там молчат.

            Файл не подписан сертификатом: при первом запуске Windows покажет
            «неизвестный издатель» → «Подробнее» → «Выполнить в любом случае».
